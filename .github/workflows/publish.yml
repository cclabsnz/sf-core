name: Publish

# Publishes @cclabsnz/sf-core to npm *with build provenance*, so the npm page shows a
# verified "Built and signed on GitHub Actions" attestation linking the published tarball
# to this exact public commit. A generated CycloneDX SBOM is attached to the release.
#
# Auth is npm Trusted Publishing (OIDC) — NO long-lived npm token is stored. The job
# exchanges its GitHub OIDC id-token for a short-lived npm credential at publish time.
# One-time setup: on npmjs.com, the package's Settings -> Trusted Publishing must list a
# GitHub Actions publisher for cclabsnz/sf-core with workflow `publish.yml`.
# See docs/RELEASE.md.
#
# Trigger is a published GitHub Release (you cut the release manually — this keeps you in
# control of when a version ships) or a manual run.
#
# Actions pinned to commit SHAs; trailing comment = human-readable version.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # attach SBOM asset to the release
      id-token: write # REQUIRED for npm provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      # NOTE: no `registry-url` — it makes setup-node write an .npmrc with a
      # placeholder _authToken, which blocks npm's OIDC trusted-publishing exchange
      # (results in E404 on publish). Omitting it lets `npm publish` do the OIDC flow.
      #
      # Trusted Publishing (OIDC) needs npm >= 11.5.1. Node 22 ships npm 10.x, so this job runs
      # on an exact Node 24 release whose bundled npm (11.19.1) is new enough. That replaces a
      # global `npm install -g npm@<version>`, which Scorecard flags as unpinned and which ran
      # inside the job that holds the OIDC token. Bumping Node here is how npm gets bumped.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.22.1
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Test
        run: pnpm test

      # Fails fast if a Node bump ever brings an npm too old for OIDC, instead of a
      # misleading E404 from the publish step.
      - name: Check npm supports OIDC trusted publishing (>= 11.5.1)
        run: |
          echo "node: $(node -v)"
          echo "npm:  $(npm -v)  (path: $(which npm))"
          node -e 'const [a,b,c]=process.argv[1].split(".").map(Number); process.exit(a>11||(a===11&&(b>5||(b===5&&c>=1)))?0:1)' "$(npm -v)"

      - name: Publish to npm with provenance (OIDC trusted publishing)
        run: |
          node -v && npm -v
          npm publish --provenance --access public

      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          format: cyclonedx-json
          output-file: sbom.cyclonedx.json

      - name: Attach SBOM to the release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: sbom.cyclonedx.json
